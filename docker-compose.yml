services:
  fdroid:
    build:
      dockerfile: Dockerfile.fdroid
    volumes:
      - ./fdroid:/home/build/repo
    command: bash entrypoint.sh

  debian:
    build:
      dockerfile: Dockerfile.debian
    platform: linux/amd64
    volumes:
      - ./linux/debian:/home/build/repo
      - ./scripts:/opt/release-repo/scripts:ro
      - type: bind
        source: ./releases.json
        target: /opt/release-repo/releases.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      PACKAGE_TOOLS: /opt/release-repo/scripts/package-tools.py
      RELEASE_MANIFEST: /opt/release-repo/releases.json
    command: bash entrypoint.sh

  ubuntu:
    build:
      dockerfile: Dockerfile.ubuntu
    platform: linux/amd64
    volumes:
      - ./linux/ubuntu:/home/build/repo
      - ./scripts:/opt/release-repo/scripts:ro
      - type: bind
        source: ./releases.json
        target: /opt/release-repo/releases.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      PACKAGE_TOOLS: /opt/release-repo/scripts/package-tools.py
      RELEASE_MANIFEST: /opt/release-repo/releases.json
    command: bash entrypoint.sh

  arch:
    build:
      dockerfile: Dockerfile.arch
    platform: linux/amd64
    volumes:
      - ./linux/arch:/home/build/repo
      - ./scripts:/opt/release-repo/scripts:ro
      - type: bind
        source: ./releases.json
        target: /opt/release-repo/releases.json
        read_only: true
        bind:
          create_host_path: false
      - ./linux/arch/templates:/opt/release-repo/linux/arch/templates:ro
    environment:
      PACKAGE_TOOLS: /opt/release-repo/scripts/package-tools.py
      RELEASE_MANIFEST: /opt/release-repo/releases.json
    command: bash entrypoint.sh
